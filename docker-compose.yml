version: '3.8'

services:
  wildtrace:
    build: .
    container_name: wildtrace-app
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
